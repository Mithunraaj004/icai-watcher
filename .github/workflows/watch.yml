name: ICAI Orientation Seat Watcher

on:
  schedule:
    - cron: "*/10 * * * *"      # backup trigger (GitHub may run it late or skip it)
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a test phone notification (skip the ICAI check)"
        required: false
        type: boolean
        default: false
      continuous:
        description: "Watch for ~5.5 hours, then automatically start the next session (tick this to go live)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                # lets a finished session start the next one

# Scheduled and continuous sessions share one queue so only one watches at a time.
# Quick manual tests use their own group so they never wait.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event.inputs.continuous == 'true') && 'icai-watch-main' || 'icai-watch-manual' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Note start time
        run: echo "SESSION_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        if: ${{ github.event.inputs.send_test != 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: icai_state.json
          key: icai-state-v3-${{ github.run_id }}
          restore-keys: icai-state-v3-

      - name: Run watcher
        id: watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_NAME: ${{ github.event_name }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
          RUN_MINUTES: ${{ github.event_name == 'schedule' && '55' || (github.event.inputs.continuous == 'true' && '340' || '0') }}
          CHECK_INTERVAL_SEC: "180"
        run: python icai_batch_watcher.py

      - name: Save state
        if: ${{ always() && github.event.inputs.send_test != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: icai_state.json
          key: icai-state-v3-${{ github.run_id }}

      - name: Start the next session
        if: ${{ !cancelled() && github.event.inputs.continuous == 'true' && github.event.inputs.send_test != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - SESSION_START ))
          if [ "$elapsed" -lt 600 ]; then
            echo "Session ended after only ${elapsed}s - not chaining (prevents a fast restart loop)."
            exit 0
          fi
          gh workflow run watch.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f continuous=true

      - name: Upload debug files on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
