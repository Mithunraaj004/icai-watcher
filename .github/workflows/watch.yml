name: ICAI Chennai + Chengalpattu Seat Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test notification to the subscribed ntfy topic"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: icai-two-centre-seat-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Install Chromium
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install-deps chromium
          fi

      - name: Restore batch state
        uses: actions/cache@v4
        with:
          path: icai_state.json
          key: icai-state-${{ github.run_id }}
          restore-keys: |
            icai-state-

      - name: Check Chennai and Chengalpattu batches and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST_NOTIFICATION: ${{ inputs.send_test || 'false' }}
        run: python icai_batch_watcher.py
